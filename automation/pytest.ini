[pytest]
testpaths = tests
pythonpath = .
addopts = -v --tb=short --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml
markers =
    ft: Functional Testing
    et: Error Testing
    bt: Boundary Testing
    pt: Permission Testing
    rsva: Module Authentification
    rsvf: Module Vols
    rsvi: Module Itineraire
    bug: Anomalie connue (xfail)
